name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: vedantix.nl-bucket
  CLOUDFRONT_DISTRIBUTION_ID: E1RSCG0YTHVC5G

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492205513:role/github-vedantix-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload versioned static assets to S3
        run: |
          # Hashed Vite assets are immutable and may still be referenced by browsers
          # that loaded the previous index.html before this deployment. Do NOT use
          # --delete here: removing old chunks immediately causes dynamic-import
          # failures for those clients.
          aws s3 sync dist/assets s3://${{ env.S3_BUCKET }}/assets \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload other static files
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --exclude "assets/*" \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --exclude "llms*.txt" \
            --exclude ".well-known/llms.txt" \
            --cache-control "public,max-age=3600"

      - name: Upload HTML entrypoints without browser cache
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

      - name: Upload search and AI discovery files with a short cache
        run: |
          aws s3 cp dist/robots.txt s3://${{ env.S3_BUCKET }}/robots.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/sitemap.xml s3://${{ env.S3_BUCKET }}/sitemap.xml \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/llms.txt s3://${{ env.S3_BUCKET }}/llms.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/llms-full.txt s3://${{ env.S3_BUCKET }}/llms-full.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/.well-known/llms.txt s3://${{ env.S3_BUCKET }}/.well-known/llms.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront and wait
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/index.html" "/*.html" "/robots.txt" "/sitemap.xml" "/llms.txt" "/llms-full.txt" "/.well-known/llms.txt" \
            --query "Invalidation.Id" \
            --output text)

          echo "CloudFront invalidation started: ${INVALIDATION_ID}"
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "${INVALIDATION_ID}"
          echo "CloudFront invalidation completed: ${INVALIDATION_ID}"

      - name: Production smoke test
        env:
          SITE_URL: https://vedantix.nl
          API_URL: https://api.vedantix.nl
        run: |
          set -euo pipefail

          echo "Checking live audit page..."
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "${SITE_URL}/online-groei-audit" \
            -o /tmp/online-groei-audit.html
          grep -q 'id="root"' /tmp/online-groei-audit.html

          AUDIT_ASSET=$(find dist/assets -maxdepth 1 -type f -name 'OnlineGrowthAudit-*.js' -printf '%f\n' | head -n 1)
          if [ -z "${AUDIT_ASSET}" ]; then
            echo "No OnlineGrowthAudit bundle found in build output."
            exit 1
          fi

          echo "Checking deployed audit bundle: ${AUDIT_ASSET}"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --head "${SITE_URL}/assets/${AUDIT_ASSET}" \
            -o /tmp/audit-asset-headers.txt
          grep -qi '^content-type:.*javascript' /tmp/audit-asset-headers.txt

          echo "Checking backend health..."
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "${API_URL}/health" \
            -o /tmp/api-health.json
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/api-health.json

          echo "Production smoke test passed."
