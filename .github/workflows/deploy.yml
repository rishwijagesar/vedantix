name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: vedantix.nl-bucket
  CLOUDFRONT_DISTRIBUTION_ID: E1RSCG0YTHVC5G

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492205513:role/github-vedantix-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static assets to S3
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --exclude "llms*.txt" \
            --exclude ".well-known/llms.txt" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML entrypoints without browser cache
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

      - name: Upload search and AI discovery files with a short cache
        run: |
          aws s3 cp dist/robots.txt s3://${{ env.S3_BUCKET }}/robots.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/sitemap.xml s3://${{ env.S3_BUCKET }}/sitemap.xml \
            --content-type "application/xml; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/llms.txt s3://${{ env.S3_BUCKET }}/llms.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/llms-full.txt s3://${{ env.S3_BUCKET }}/llms-full.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

          aws s3 cp dist/.well-known/llms.txt s3://${{ env.S3_BUCKET }}/.well-known/llms.txt \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "CloudFront invalidation started: ${INVALIDATION_ID}"
