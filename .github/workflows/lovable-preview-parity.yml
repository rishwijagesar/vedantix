name: Lovable Preview Parity

on:
  push:
    branches:
      - lovable-migration
    paths:
      - .github/workflows/lovable-preview-parity.yml

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture production and Lovable screenshots
        run: |
          mkdir -p lovable-parity
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const routes = [
            ['home', '/'],
            ['prijzen', '/prijzen'],
            ['resultaten', '/resultaten'],
            ['contact', '/contact'],
            ['faq', '/faq'],
            ['audit', '/online-groei-audit'],
            ['ai-vindbaarheid', '/ai-vindbaarheid'],
            ['blog', '/blog'],
          ];

          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          const targets = [
            ['production', 'https://vedantix.nl'],
            ['lovable', 'https://id-preview--1a802d37-67b8-4407-98f6-913af6f7a354.lovable.app'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [viewportName, viewport] of viewports) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              page.on('pageerror', error => console.error('PAGEERROR', error.message));
              for (const [targetName, base] of targets) {
                for (const [routeName, route] of routes) {
                  const url = `${base}${route}`;
                  console.log(`Capturing ${viewportName} ${targetName} ${url}`);
                  await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                  await page.waitForTimeout(3000);
                  await page.screenshot({ path: `lovable-parity/${viewportName}-${targetName}-${routeName}.png`, fullPage: true });
                }
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('lovable-parity/README.txt', 'Production vs current Lovable preview, desktop 1440x1000 and mobile 390x844.');
          })().catch(error => { console.error(error); process.exit(1); });
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: vedantix-lovable-parity
          path: lovable-parity
          retention-days: 7
