name: Refresh migration lockfile

on:
  push:
    branches:
      - lovable-migration
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lovable-migration

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: refresh lockfile without Base44"
          git push origin HEAD:lovable-migration
