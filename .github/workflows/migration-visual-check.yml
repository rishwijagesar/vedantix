name: Migration Visual Check

on:
  push:
    branches:
      - lovable-migration

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Chromium screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start migration preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vedantix-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vedantix-preview.log
          exit 1

      - name: Capture production and migration screenshots
        run: |
          mkdir -p migration-screenshots
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const routes = [
            ['home', '/'],
            ['prijzen', '/prijzen'],
            ['resultaten', '/resultaten'],
            ['contact', '/contact'],
            ['faq', '/faq'],
            ['audit', '/online-groei-audit'],
            ['ai-vindbaarheid', '/ai-vindbaarheid'],
            ['blog', '/blog'],
          ];

          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          const targets = [
            ['production', 'https://vedantix.nl'],
            ['migration', 'http://127.0.0.1:4173'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [viewportName, viewport] of viewports) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              page.on('pageerror', error => console.error('PAGEERROR', error.message));

              for (const [targetName, base] of targets) {
                for (const [routeName, route] of routes) {
                  const url = `${base}${route}`;
                  console.log(`Capturing ${viewportName} ${targetName} ${url}`);
                  await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                  await page.waitForTimeout(2500);
                  await page.screenshot({
                    path: `migration-screenshots/${viewportName}-${targetName}-${routeName}.png`,
                    fullPage: true,
                  });
                }
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('migration-screenshots/README.txt', 'Production and lovable-migration screenshots captured at desktop 1440x1000 and mobile 390x844.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Upload visual comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: vedantix-migration-visual-check
          path: migration-screenshots
          retention-days: 7
